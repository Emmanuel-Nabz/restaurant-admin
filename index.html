    <script>
        // ============================================================
        // SIMPLE LOGIN - ONE USER (HARDCODED)
        // ============================================================
        var loggedIn = false;

        function login() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value.trim();
            var errorEl = document.getElementById('loginError');

            // ONE USER: admin / admin123
            if (username === 'admin' && password === 'admin123') {
                errorEl.textContent = '';
                loggedIn = false;
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('dashboardPage').style.display = 'block';
                document.getElementById('currentUser').textContent = '👤 admin';
                loadOrders();
                setInterval(loadOrders, 30000);
            } else {
                errorEl.textContent = '❌ Invalid username or password.';
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                loggedIn = false;
                document.getElementById('dashboardPage').style.display = 'none';
                document.getElementById('loginPage').style.display = 'block';
                document.getElementById('loginPassword').value = '';
            }
        }

        // ============================================================
        // LOAD ORDERS
        // ============================================================
        var allOrders = [];

        function loadOrders() {
            allOrders = JSON.parse(localStorage.getItem('nabzOrders')) || [];
            applyFilters();
        }

        function applyFilters() {
            var search = document.getElementById('searchInput').value.toLowerCase();
            var statusFilter = document.getElementById('statusFilter').value;
            var dateFrom = document.getElementById('dateFrom').value;
            var dateTo = document.getElementById('dateTo').value;

            var filtered = allOrders.filter(function(order) {
                var matchSearch = !search ||
                    order.name.toLowerCase().includes(search) ||
                    String(order.id).includes(search);

                var matchStatus = statusFilter === 'all' || order.status === statusFilter;

                var matchDate = true;
                if (dateFrom || dateTo) {
                    var orderDate = new Date(order.date).toISOString().split('T')[0];
                    if (dateFrom && orderDate < dateFrom) matchDate = false;
                    if (dateTo && orderDate > dateTo) matchDate = false;
                }

                return matchSearch && matchStatus && matchDate;
            });

            renderOrders(filtered);
            updateStats(filtered);
        }

        function renderOrders(orders) {
            var container = document.getElementById('ordersContainer');
            document.getElementById('orderCount').textContent = orders.length;

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <i class="fas fa-inbox"></i>
                        <p>No orders found</p>
                    </div>
                `;
                return;
            }

            var html = '';
            orders.forEach(function(order, index) {
                var statusClass = '';
                var statusText = '';

                if (order.status === 'Completed') {
                    statusClass = 'completed';
                    statusText = '✅ Completed';
                } else if (order.status === 'Rejected') {
                    statusClass = 'rejected';
                    statusText = '❌ Rejected';
                } else {
                    statusClass = '';
                    statusText = '⏳ Pending';
                }

                var originalIndex = allOrders.indexOf(order);

                html += `
                    <div class="order-card ${statusClass}">
                        <div class="order-header">
                            <span class="order-id">#${originalIndex + 1}</span>
                            <span class="order-status ${order.status.toLowerCase()}">${statusText}</span>
                        </div>
                        <div class="order-details"><i class="fas fa-calendar"></i> ${order.date}</div>
                        <div class="order-details"><i class="fas fa-user"></i> ${order.name}</div>
                        <div class="order-details"><i class="fas fa-phone"></i> ${order.phone}</div>
                        <div class="order-details"><i class="fas fa-map-pin"></i> ${order.address}</div>
                        <div class="order-details"><i class="fas fa-credit-card"></i> ${order.payment}</div>
                        <div class="order-items">
                            ${order.items.map(function(item) {
                                return item.quantity + 'x ' + item.name;
                            }).join(', ')}
                        </div>
                        <div class="order-total">💰 Total: BD ${order.total.toFixed(2)}</div>

                        <div class="order-actions">
                            ${order.status === 'Pending' ? `
                                <button class="btn btn-accept" onclick="updateOrderStatus(${originalIndex}, 'Completed')">✅ Accept</button>
                                <button class="btn btn-reject" onclick="updateOrderStatus(${originalIndex}, 'Rejected')">❌ Reject</button>
                            ` : `
                                ${order.status === 'Completed' ? `
                                    <span style="color: #27ae60; font-weight: bold;">✅ Order Completed</span>
                                ` : `
                                    <span style="color: #e74c3c; font-weight: bold;">❌ Order Rejected</span>
                                `}
                                <button class="btn btn-delete" onclick="deleteOrder(${originalIndex})">🗑️ Delete</button>
                            `}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateStats(orders) {
            var pending = orders.filter(function(o) { return o.status === 'Pending'; });
            var completed = orders.filter(function(o) { return o.status === 'Completed'; });

            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('pendingOrders').textContent = pending.length;
            document.getElementById('completedOrders').textContent = completed.length;

            var revenue = 0;
            completed.forEach(function(o) { revenue += o.total; });
            document.getElementById('totalRevenue').textContent = 'BD ' + revenue.toFixed(2);
        }

        // ============================================================
        // ORDER ACTIONS
        // ============================================================
        function updateOrderStatus(index, status) {
            var orders = JSON.parse(localStorage.getItem('nabzOrders')) || [];
            if (index >= 0 && index < orders.length) {
                orders[index].status = status;
                localStorage.setItem('nabzOrders', JSON.stringify(orders));
                loadOrders();
                showNotification('✅ Order #' + (index + 1) + ' updated to ' + status);
            }
        }

        function deleteOrder(index) {
            if (confirm('Delete this order?')) {
                var orders = JSON.parse(localStorage.getItem('nabzOrders')) || [];
                if (index >= 0 && index < orders.length) {
                    orders.splice(index, 1);
                    localStorage.setItem('nabzOrders', JSON.stringify(orders));
                    loadOrders();
                    showNotification('🗑️ Order #' + (index + 1) + ' deleted');
                }
            }
        }

        function clearAllOrders() {
            if (confirm('Delete ALL orders? This cannot be undone!')) {
                localStorage.removeItem('nabzOrders');
                loadOrders();
                showNotification('🗑️ All orders cleared');
            }
        }

        function exportCSV() {
            var orders = JSON.parse(localStorage.getItem('nabzOrders')) || [];

            if (orders.length === 0) {
                alert('No orders to export.');
                return;
            }

            var csv = 'Order #,Date,Name,Phone,Address,Payment,Items,Total,Status\n';
            orders.forEach(function(order, index) {
                var items = order.items.map(function(item) {
                    return item.quantity + 'x ' + item.name;
                }).join('; ');
                csv += (index + 1) + ',' +
                    order.date + ',' +
                    order.name + ',' +
                    order.phone + ',' +
                    order.address + ',' +
                    order.payment + ',' +
                    items + ',' +
                    order.total.toFixed(2) + ',' +
                    order.status + '\n';
            });

            var blob = new Blob([csv], { type: 'text/csv' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'orders-' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
            URL.revokeObjectURL(url);

            showNotification('📊 Orders exported to CSV');
        }

        function showNotification(message) {
            var existing = document.querySelector('.notification');
            if (existing) existing.remove();

            var div = document.createElement('div');
            div.className = 'notification';
            div.innerHTML = '<i class="fas fa-bell"></i> ' + message;
            document.body.appendChild(div);

            setTimeout(function() {
                div.remove();
            }, 3000);
        }

        // ============================================================
        // START
        // ============================================================
        console.log("🚀 Admin Dashboard loaded!");
    </script>

</body>
